spring.application.name=priut-bot

# --- Telegram bot ---
# Get a token from @BotFather in Telegram (see README). Never commit a real token.
bot.token=${BOT_TOKEN:PUT_YOUR_BOT_TOKEN_HERE}
bot.username=${BOT_USERNAME:PutYourBotUsernameHere}
# Comma-separated Telegram chat IDs of volunteers who may use volunteer commands
# and who receive "call a volunteer" / overdue-report / probation-end notifications.
bot.volunteer-chat-ids=${VOLUNTEER_CHAT_IDS:}

# --- Datasource: PostgreSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/priut_bot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:priut_bot_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Scheduled checks ---
# Daily job: warns volunteers about new owners with no report for 2+ days,
# and flags new owners whose probation period has ended (a volunteer decides next steps).
bot.scheduler.daily-check-cron=0 0 21 * * *
